# Construye el sitio con Quarto y lo publica en GitHub Pages
# cada vez que cambia el contenido (por ejemplo, al guardar desde Pages CMS).
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: pip install pyyaml

      - name: Acomodar ejercicios nuevos y regenerar índices
        run: |
          python3 _scripts/acomodar_ejercicios.py
          python3 _scripts/generar_indices.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Acomoda ejercicios y actualiza índices automáticamente"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Los índices ya estaban al día."
          fi

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - name: Generar el proyecto Quarto desde los ejercicios
        run: python3 _scripts/construir_sitio_quarto.py

      - name: Renderizar el sitio
        run: quarto render sitio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/_site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
